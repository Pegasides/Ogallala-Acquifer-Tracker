<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquifer Simulation Map - Ogallala Aquifer Tracker</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1a252f;
            padding: 25px;
            text-align: center;
            border-bottom: 4px solid #1abc9c;
        }
        h1 { margin: 0; font-size: 2.4rem; }
        header p { margin: 5px 0 0 0; font-style: italic; color: #bdc3c7; }
        
        nav {
            background-color: #34495e;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 15px 0;
            gap: 10px;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            background-color: #2c3e50;
            border: 2px solid #1abc9c;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        nav a:hover {
            background-color: #1abc9c;
            color: #2c3e50;
            transform: translateY(-2px);
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: #1a252f;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* 3-LAYER GEOGRAPHIC MAP CONTAINER */
        #map-viewport {
            height: 550px;
            width: 100%;
            border-radius: 8px;
            background: #16161a;
            position: relative;
            overflow: hidden;
            border: 2px solid #34495e;
            margin: 20px 0;
        }

        .map-grid {
            position: absolute;
            width: 500px;
            height: 500px;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* LAYER 1: State Borders */
        .state {
            position: absolute;
            border: 1px dashed #44444c;
            background-color: rgba(255,255,255,0.02);
            color: #7f8c8d;
            font-size: 11px;
            font-weight: bold;
            padding: 4px;
            border-radius: 4px;
        }
        #SD { top: 0px; left: 140px; width: 200px; height: 80px; }
        #WY { top: 90px; left: 0px; width: 130px; height: 90px; }
        #NE { top: 90px; left: 140px; width: 220px; height: 90px; border-color: #1abc9c; color: #1abc9c; }
        #CO { top: 190px; left: 10px; width: 120px; height: 95px; }
        #KS { top: 195px; left: 140px; width: 220px; height: 90px; }
        #NM { top: 295px; left: 10px; width: 120px; height: 110px; }
        #OK { top: 295px; left: 140px; width: 220px; height: 45px; }
        #TX { top: 350px; left: 105px; width: 180px; height: 140px; }

        /* LAYER 2: Underlying Organic Aquifer Fluid Pocket */
        #simulated-aquifer {
            position: absolute;
            top: 110px;
            left: 130px;
            background-color: #2b6cb0;
            border-radius: 40% 50% 30% 60% / 50% 40% 60% 30%;
            transition: all 0.2s ease-out;
            opacity: 0.85;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #aquifer-status-label {
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            text-align: center;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            padding: 10px;
        }

        /* LAYER 3: Pulsing Infrastructure Community Nodes */
        .dc-node {
            width: 12px;
            height: 12px;
            background-color: #ef4444;
            border: 2px solid white;
            border-radius: 50%;
            position: absolute;
            z-index: 20;
            animation: pulse 1.8s infinite ease-in-out;
        }

        .node-label {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            border: 1px solid #555;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            color: #fff;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.2); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* TIMELINE SLIDER CONTROLS FRAME */
        .controls {
            margin-top: 25px;
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 6px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            height: 8px;
            accent-color: #1abc9c;
        }
        .labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #bdc3c7;
            font-weight: bold;
        }
        .active-label {
            color: #1abc9c;
            text-shadow: 0 0 5px rgba(26,188,156,0.3);
        }
        #desc-display {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #bdc3c7;
            min-height: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ogallala Aquifer Tracker</h1>
        <h2>Year: <span id="year-display">2026</span></h2>
    </header>

    <nav>
        <a href="index.html">Ogallala Aquifer Tracker</a>
        <a href="map.html">Interactive Map Matrix</a>
        <a href="timeline-1980.html">1980 Timeline</a>
        <a href="timeline-2026.html">2026</a>
        <a href="present.html">Present Day</a>
        <a href="timeline-projection.html">2050 Projection</a>
        <a href="dashboard.html">Data Dashboard</a>
    </nav>

    <main>
        <div id="map-viewport">
            <!-- Background Map Layer: The 8 Affected States -->
            <div class="map-grid">
                <div class="state" id="SD">SOUTH DAKOTA</div>
                <div class="state" id="WY">WYOMING</div>
                <div class="state" id="NE">NEBRASKA</div>
                <div class="state" id="CO">COLORADO</div>
                <div class="state" id="KS">KANSAS</div>
                <div class="state" id="NM">NEW MEXICO</div>
                <div class="state" id="OK">OKLAHOMA</div>
                <div class="state" id="TX">TEXAS</div>
                
                <!-- Foreground Layer: The Underground Aquifer Fluid Pocket -->
                <div id="simulated-aquifer">
                    <span id="aquifer-status-label">Ogallala Aquifer</span>
                </div>

                <!-- Overlay Layer: Infrastructure Node Container -->
                <div id="nodes-container"></div>
            </div>
        </div>

        <div class="controls">
            <input type="range" id="timeline" min="1950" max="2050" step="1" value="2026">
            <div class="labels">
                <span id="lbl-1950">1950</span>
                <span id="lbl-1980">1980</span>
                <span id="lbl-2026">2026</span>
                <span id="lbl-2035">2035</span>
                <span id="lbl-2050">2050</span>
            </div>
            <p id="desc-display">Loading timeline parameters...</p>
        </div>
    </main>

    <script>
        function updateTimeline(year) {
            document.getElementById('year-display').innerText = year;
            let width, height, opacity, color, labelText, descText;
            let centers = [];

            if (year <= 1980) {
                let pct = (year - 1950) / (1980 - 1950);
                width = 240 - (pct * 30);
                height = 400 - (pct * 40);
                opacity = 0.95 - (pct * 0.15);
                color = "#2b6cb0";
                labelText = `Status: Healthy<br>Volume: ${Math.round(95 - (pct * 20))}%`;
                descText = "Post-WWII agriculture introduces deep-well turbine layouts across Nebraska and Kansas.";
                centers = [];
            } else if (year <= 2026) {
                let pct = (year - 1980) / (2026 - 1980);
                width = 210 - (pct * 40);
                height = 360 - (pct * 60);
                opacity = 0.80 - (pct * 0.30);
                color = "#3182bd";
                labelText = `Status: Stressed<br>Volume: ${Math.round(75 - (pct * 20))}%`;
                descText = "Present Day. Massive irrigation drawdowns combined with early machine learning server footprints.";
                centers = [
                    { name: "Omaha Hub (NE)", top: "110px", left: "220px" },
                    { name: "Dallas Node (TX)", top: "390px", left: "160px" }
                ];
            } else if (year <= 2035) {
                let pct = (year - 2026) / (2035 - 2026);
                width = 170 - (pct * 40);
                height = 300 - (pct * 60);
                opacity = 0.50 - (pct * 0.20);
                color = "#d97706"; 
                labelText = `Critical Depletion!<br>Volume: ${Math.round(55 - (pct * 25))}%`;
                descText = "Projected 2035. Extended droughts push tech grids to claim high-capacity deep infrastructure links.";
                centers = [
                    { name: "Omaha Hub (NE)", top: "110px", left: "220px" },
                    { name: "Dallas Node (TX)", top: "390px", left: "160px" },
                    { name: "Cheyenne Link (WY)", top: "110px", left: "30px" }
                ];
            } else {
