    <style>
        body { background-color: #2c3e50 !important; color: #ffffff !important; font-family: Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1a252f; padding: 20px; text-align: center; border-bottom: 4px solid #1abc9c; flex-shrink: 0; }
        h1 { margin: 0; font-size: 2.2rem; color: #ffffff; }
        h2 { margin: 5px 0 0 0; color: #bdc3c7; font-size: 1.2rem; }
        
        nav { background-color: #34495e; padding: 10px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid #2c3e50; flex-shrink: 0; }
        nav a { color: #ffffff; text-decoration: none; padding: 10px 16px; background-color: #2c3e50; border: 2px solid #1abc9c; border-radius: 5px; font-weight: bold; font-size: 13px; }
        nav a:hover { background-color: #1abc9c; color: #2c3e50; }
        
        .main-flex-row { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; padding: 20px; gap: 20px; box-sizing: border-box; background-color: #1a252f; max-width: 1040px; margin: 20px auto; border-radius: 8px; width: 95%; }
        
        #map-viewport { width: 500px; height: 550px; background-color: #16161a; border: 2px solid #34495e; border-radius: 8px; position: relative; overflow: hidden; flex-shrink: 0; }
        .map-grid { position: absolute; width: 500px; height: 500px; top: 25px; left: 0; }
        .state { position: absolute; border: 1px dashed #44444c; background: rgba(255,255,255,0.01); color: #444; font-size: 11px; font-weight: bold; padding: 5px; pointer-events: none; }
        
        .health-circle { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; transition: background-color 0.2s, width 0.2s, height 0.2s, border-color 0.2s; z-index: 5; pointer-events: none; }
        .circle-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 9px; font-weight: bold; color: #ffffff; text-shadow: 1px 1px 3px #000; text-align: center; white-space: nowrap; }
        .metric-row { border-bottom: 1px solid #34495e; padding: 6px 0; display: flex; justify-content: space-between; font-size: 0.85rem; }
        .metric-row:last-child { border-bottom: none; }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
            70% { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 0 10px rgba(239,68,68,0); }
            100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }
    </style>
</head>
