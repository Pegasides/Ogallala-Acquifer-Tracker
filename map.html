<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogallala Aquifer Timeline Map</title>
    
    <!-- Core Mapping Layout Stylesheets -->
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />
    
    <style>
        body {
            margin: 0; padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111111; color: #ffffff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #3b82f6; margin: 0; font-size: 2rem; }
        p { color: #cccccc; min-height: 48px; line-height: 1.5; }
        #map { height: 500px; width: 100%; border-radius: 8px; background: #222; }
        .controls { margin-top: 25px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .labels { display: flex; justify-content: space-between; margin-top: 10px; color: #888; }
        .active-label { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Year: <span id="year-display">2026</span></h2>
        <p id="desc-display">Present Day. Data centers overlap with heavily depleted water tables.</p>
    </header>

    <div id="map"></div>

    <div class="controls">
        <input type="range" id="timeline" min="0" max="4" step="1" value="2">
        <div class="labels">
            <span>1950</span>
            <span>1980</span>
            <span id="label-2" class="active-label">2026 (Present)</span>
            <span>2035 Proj</span>
            <span>2050 Proj</span>
        </div>
    </div>
</div>

<!-- Core Mapping External Engine Library -->
<script src="https://unpkg.com" crossorigin=""></script>

<script>
    // SAFETY LATCH: Waits until the window finishes loading the Leaflet script fully
    window.addEventListener('load', function() {
        try {
            // Confirm the mapping variable exists before running commands
            if (typeof L === 'undefined') {
                throw new Error("Leaflet script failed to load from network provider.");
            }

            const map = L.map('map').setView([39.5, -101.5], 6);

            L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
                attribution: '&copy; CARTO'
            }).addTo(map);

            const timelineSteps = [
                { year: "1950", desc: "Pre-development aquifer levels. High water thickness.", opacity: 0.9, color: "#3182bd", centers: [] },
                { year: "1980", desc: "Agricultural irrigation begins drawing down southern sectors.", opacity: 0.7, color: "#3182bd", centers: [] },
                { year: "2026", desc: "Present Day. Data center nodes overlap with depleted water tables.", opacity: 0.4, color: "#3182bd", centers: [{name:"Omaha Hub", lat:41.25, lng:-95.93}] },
                { year: "2035", desc: "Projected. Extended drought pushes computational centers to seek regional wells.", opacity: 0.25, color: "#d97706", centers: [{name:"Omaha Hub", lat:41.25, lng:-95.93}, {name:"Cheyenne Node", lat:41.14, lng:-104.82}] },
                { year: "2050", desc: "Projected. Severe water depletion zones intersect heavily with critical infrastructure.", opacity: 0.1, color: "#ef4444", centers: [{name:"Omaha Hub", lat:41.25, lng:-95.93}, {name:"Cheyenne Node", lat:41.14, lng:-104.82}, {name:"Platte River Node", lat:40.69, lng:-99.08}] }
            ];

            const aquiferBounds = [[32.0, -104.0], [43.5, -97.0]];
            let aquiferLayer = L.rectangle(aquiferBounds, { stroke: false, fillColor: "#3182bd", fillOpacity: 0.4 }).addTo(map);
            let markerLayerGroup = L.layerGroup().addTo(map);

            function updateTimeline(index) {
                const step = timelineSteps[index];
                document.getElementById('year-display').innerText = step.year;
                document.getElementById('desc-display').innerText = step.desc;

                aquiferLayer.setStyle({ fillColor: step.color, fillOpacity: step.opacity });
                markerLayerGroup.clearLayers();

                step.centers.forEach(c => {
                    L.circleMarker([c.lat, c.lng], { radius: 8, fillColor: "#ef4444", color: "#fff", weight: 2, fillOpacity: 0.9 })
                     .bindPopup(`<b>${c.name}</b><br>AI Data Center Hub`)
                     .addTo(markerLayerGroup);
                });

                document.getElementById('label-2').className = (index == 2) ? 'active-label' : '';
            }

            document.getElementById('timeline').addEventListener('input', (e) => updateTimeline(e.target.value));
            updateTimeline(2);

        } catch (error) {
            console.error("Map initialization roadblock encountered:", error);
            document.getElementById('desc-display').innerText = "System Notification: " + error.message;
        }
    });
</script>

</body>
</html>
