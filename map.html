<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogallala Aquifer Timeline Map</title>
    
    <!-- EMBEDDED LEAFLET STYLING (No external download needed) -->
    <style>
        /* Core Leaflet Layout Styles */
        .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent}.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-user-drag:none}.leaflet-safari .leaflet-tile{image-rendering:optimizeSpeed}.leaflet-safari .leaflet-tile-container{width:1600px;height:1600px;-webkit-transform-origin:0 0}.leaflet-marker-icon,.leaflet-marker-shadow{display:block}.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}.leaflet-map-pane svg{z-index:1}.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-zoom-box{width:0;height:0;-moz-box-sizing:border-box;box-sizing:border-box;z-index:800}.leaflet-overlay-pane svg{position:absolute;pointer-events:none}.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px}.leaflet-popup-content{margin:13px 19px;line-height:1.4}.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;-webkit-transform:rotate(45deg);-moz-transform:rotate(45deg);-ms-transform:rotate(45deg);transform:rotate(45deg)}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:white;color:#333;box-shadow:0 3px 14px rgba(0,0,0,0.4)}
        
        /* Your Custom Website Page Styling */
        body {
            margin: 0; padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111111; color: #ffffff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #3b82f6; margin: 0; font-size: 2rem; }
        p { color: #cccccc; min-height: 48px; line-height: 1.5; }
        #map { height: 500px; width: 100%; border-radius: 8px; background: #222; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #333;}
        .controls { margin-top: 25px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .labels { display: flex; justify-content: space-between; margin-top: 10px; color: #888; }
        .active-label { color: #3b82f6; font-weight: bold; }
        
        /* Inline Simulation Layout Shapes */
        #simulated-aquifer {
            width: 70%; height: 70%;
            background-color: #3182bd;
            border-radius: 12px;
            transition: all 0.5s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dc-node {
            width: 14px; height: 14px;
            background-color: #ef4444;
            border: 2px solid white;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px #ef4444;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px #ef4444; }
            100% { transform: scale(1); opacity: 0.9; }
        }
        .node-label {
            position: absolute; top: -20px; background: rgba(0,0,0,0.8);
            padding: 2px 6px; border-radius: 4px; font-size: 11px; white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Year: <span id="year-display">2026</span></h2>
        <p id="desc-display">Present Day. Data centers overlap with heavily depleted water tables.</p>
    </header>

    <!-- The Visual Simulator Container -->
    <div id="map">
        <div id="simulated-aquifer">
            <span id="aquifer-status-label" style="font-weight: bold; font-size: 1.2rem; pointer-events: none; text-shadow: 1px 1px 4px rgba(0,0,0,0.6)">Ogallala Aquifer Grid</span>
            <div id="nodes-container"></div>
        </div>
    </div>

    <div class="controls">
        <input type="range" id="timeline" min="0" max="4" step="1" value="2">
        <div class="labels">
            <span>1950</span>
            <span>1980</span>
            <span id="label-2" class="active-label">2026 (Present)</span>
            <span>2035 Proj</span>
            <span>2050 Proj</span>
        </div>
    </div>
</div>

<script>
    // Self-contained visual rendering system (No outside library dependencies required)
    const timelineSteps = [
        { 
            year: "1950", 
            desc: "Pre-development aquifer levels. High saturated thickness across the High Plains grid.", 
            opacity: 0.95, size: "85%", color: "#2b6cb0", label: "Healthy Aquifer (95% Volume)",
            centers: [] 
        },
        { 
            year: "1980", 
            desc: "Agricultural boom. Heavy center-pivot irrigation lines begin drawdown cycles.", 
            opacity: 0.75, size: "70%", color: "#3182bd", label: "Sustained Drawdown (75% Volume)",
            centers: [] 
        },
        { 
            year: "2026", 
            desc: "Present Day. Early clusters of machine learning nodes expand operations over depleted water tables.", 
            opacity: 0.50, size: "55%", color: "#4992c2", label: "Stressed Grid (55% Volume)",
            centers: [
                { name: "Omaha Hub", top: "25%", left: "75%" },
                { name: "Dallas Node", top: "75%", left: "65%" }
            ] 
        },
        { 
            year: "2035", 
            desc: "Projected. Extended drought patterns push computational corridors to expand deep-well structural access.", 
            opacity: 0.30, size: "40%", color: "#d97706", label: "Critical Depletion (30% Volume)",
            centers: [
                { name: "Omaha Hub", top: "25%", left: "75%" },
                { name: "Dallas Node", top: "75%", left: "65%" },
                { name: "Cheyenne Expansion", top: "30%", left: "20%" }
            ] 
        },
        { 
            year: "2050", 
            desc: "Projected. Critical saturation threshold failures intersect heavily with scaling compute grid infrastructure.", 
            opacity: 0.12, size: "25%", color: "#dc2626", label: "Grid Failure Threat (12% Volume)",
            centers: [
                { name: "Omaha Hub", top: "25%", left: "75%" },
                { name: "Dallas Node", top: "75%", left: "65%" },
                { name: "Cheyenne Expansion", top: "30%", left: "20%" },
                { name: "Platte River Node", top: "45%", left: "50%" }
            ] 
        }
    ];

    function updateTimeline(index) {
        const step = timelineSteps[index];
        
        // Update header texts
        document.getElementById('year-display').innerText = step.year;
        document.getElementById('desc-display').innerText = step.desc;

        // Animate and alter the Aquifer visual layout boundaries
        const aquifer = document.getElementById('simulated-aquifer');
        aquifer.style.width = step.size;
        aquifer.style.height = step.size;
        aquifer.style.backgroundColor = step.color;
        aquifer.style.opacity = step.opacity;
        document.getElementById('aquifer-status-label').innerText = step.label;

        // Clear and rebuild the Data Center visual dots
        const container = document.getElementById('nodes-container');
        container.innerHTML = "";
        
        step.centers.forEach(c => {
            const node = document.createElement('div');
            node.className = 'dc-node';
            node.style.top = c.top;
            node.style.left = c.left;
            node.innerHTML = `<div class="node-label">${c.name}</div>`;
            container.appendChild(node);
        });

        // Toggle label styling
        document.getElementById('label-2').className = (index == 2) ? 'active-label' : '';
    }

    // Attach input timeline listener
    document.getElementById('timeline').addEventListener('input', (e) => {
        updateTimeline(parseInt(e.target.value));
    });

    // Initialize map display
    updateTimeline(2);
</script>

</body>
</html>
