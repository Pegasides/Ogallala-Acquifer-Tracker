<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogallala Aquifer Timeline Map</title>
    
    <style>
        body {
            margin: 0; padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111111; color: #ffffff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #3b82f6; margin: 0; font-size: 2rem; }
        p { color: #cccccc; min-height: 48px; line-height: 1.5; }
        
        #map { 
            height: 550px; width: 100%; 
            border-radius: 8px; background: #16161a; 
            position: relative; overflow: hidden; 
            border: 1px solid #333;
        }
        
        .map-grid {
            position: absolute; width: 500px; height: 500px;
            top: 25px; left: 50%; transform: translateX(-50%);
        }
        
        /* FIXED: Added z-index: 15 and pointer-events: none to make them see-through overlays */
        .state {
            position: absolute; border: 1px dashed #555562;
            background-color: rgba(255,255,255,0.01);
            color: #71717a; font-size: 11px; font-weight: bold;
            padding: 4px; border-radius: 4px;
            display: flex; align-items: flex-start; justify-content: flex-start;
            z-index: 15; 
            pointer-events: none; 
        }
        
        #SD { top: 0px; left: 140px; width: 200px; height: 80px; }
        #WY { top: 90px; left: 0px; width: 130px; height: 90px; }
        #NE { top: 90px; left: 140px; width: 220px; height: 90px; }
        #CO { top: 190px; left: 10px; width: 120px; height: 95px; }
        #KS { top: 195px; left: 140px; width: 220px; height: 90px; }
        #NM { top: 295px; left: 10px; width: 120px; height: 110px; }
        #OK { top: 295px; left: 140px; width: 220px; height: 45px; }
        #TX { top: 350px; left: 105px; width: 180px; height: 140px; }

        /* FIXED: Set z-index to 10 so it sits behind the state outlines */
        #simulated-aquifer {
            position: absolute;
            top: 40px; left: 120px; 
            width: 210px; height: 380px;
            background-color: #3b82f6;
            border-radius: 40% 50% 30% 60% / 50% 40% 60% 30%; 
            transition: all 0.1s linear;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; 
            pointer-events: none;
        }
        
        #aquifer-status-label {
            font-weight: bold; font-size: 11px; color: #fff; text-align: center;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8); padding: 5px;
            z-index: 11;
        }

        .controls { margin-top: 25px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .labels { display: flex; justify-content: space-between; margin-top: 10px; color: #888; }
        .active-label { color: #3b82f6; font-weight: bold; }
        
        /* Data center dots remain on the absolute top layer */
        .dc-node {
            width: 12px; height: 12px; background-color: #ef4444;
            border: 2px solid white; border-radius: 50%; position: absolute;
            z-index: 25; animation: pulse 1.8s infinite ease-in-out;
        }
        .node-label {
            position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); border: 1px solid #444;
            padding: 1px 6px; border-radius: 4px; font-size: 10px; white-space: nowrap; color: #fff;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Year: <span id="year-display">2026</span></h2>
        <p id="desc-display">Present Day. Data centers overlap with heavily depleted water tables.</p>
    </header>

    <div id="map">
        <div class="map-grid">
            
            <!-- These outlines will now overlay ON TOP of the water pocket -->
            <div class="state" id="SD">SOUTH DAKOTA</div>
            <div class="state" id="WY">WYOMING</div>
            <div class="state" id="NE">NEBRASKA</div>
            <div class="state" id="CO">COLORADO</div>
            <div class="state" id="KS">KANSAS</div>
            <div class="state" id="NM">NEW MEXICO</div>
            <div class="state" id="OK">OKLAHOMA</div>
            <div class="state" id="TX">TEXAS</div>

            <!-- The Aquifer sits safely underneath the state lines now -->
            <div id="simulated-aquifer">
                <span id="aquifer-status-label">Ogallala Aquifer</span>
            </div>
            
            <div id="nodes-container"></div>
            
        </div>
    </div>

    <div class="controls">
        <input type="range" id="timeline" min="1950" max="2050" step="1" value="2026">
        <div class="labels">
            <span id="lbl-1950">1950</span>
            <span id="lbl-1980">1980</span>
            <span id="lbl-2026" class="active-label">2026</span>
            <span id="lbl-2035">2035 Proj</span>
            <span id="lbl-2050">2050 Proj</span>
        </div>
    </div>
</div>

<script>
    function updateTimeline(year) {
        document.getElementById('year-display').innerText = year;
        
        let width, height, opacity, color, labelText, descText;
        let centers = [];

        // FIXED: Lightened up maximum opacity parameters to ensure grid lines show through beautifully
        if (year <= 1980) {
            let pct = (year - 1950) / (1980 - 1950);
            width = 210 - (pct * 20);      
            height = 380 - (pct * 30);     
            opacity = 0.85 - (pct * 0.15); // Lightened starting point to 85% opacity
            color = "#3b82f6";             // Vibrant, see-through Sky Blue
            labelText = `Aquifer Status: Healthy<br>Volume: ${Math.round(95 - (pct * 20))}%`;
            descText = "Post-WWII agriculture introduces deep-well turbine layouts across Nebraska and Kansas.";
        } 
        else if (year <= 2026) {
            let pct = (year - 1980) / (2026 - 1980);
            width = 190 - (pct * 30);      
            height = 350 - (pct * 40);     
            opacity = 0.70 - (pct * 0.25); 
            color = "#60a5fa";             
            labelText = `Aquifer Status: Stressed<br>Volume: ${Math.round(75 - (pct * 20))}%`;
            descText = "Present Day. Massive irrigation drawdowns combined with early machine learning server footprints.";
            centers = [
                { name: "Omaha Hub (NE)", top: "120px", left: "320px" },
                { name: "Dallas Suburb Node (TX)", top: "430px", left: "220px" }
            ];
        } 
        else if (year <= 2035) {
            let pct = (year - 2026) / (2035 - 2026);
            width = 160 - (pct * 40);      
            height = 310 - (pct * 60);     
            opacity = 0.45 - (pct * 0.15); 
            color = "#f59e0b";             // Warning Amber
            labelText = `Critical Depletion!<br>Volume: ${Math.round(55 - (pct * 25))}%`;
            descText = "Projected 2035. Extended droughts push tech grids to claim high-capacity deep infrastructure links.";
            centers = [
                { name: "Omaha Hub (NE)", top: "120px", left: "320px" },
                { name: "Dallas Suburb Node (TX)", top: "430px", left: "220px" },
                { name: "Cheyenne Link (WY)", top: "130px", left: "40px" }
            ];
        } 
        else {
            let pct = (year - 2035) / (2050 - 2035);
            width = 120 - (pct * 40);      
            height = 250 - (pct * 80);     
            opacity = 0.30 - (pct * 0.15); 
            color = "#ef4444";             // Threat Level Red
            labelText = `Grid Threat Alert!<br>Volume: ${Math.round(30 - (pct * 18))}%`;
            descText = "Projected 2050. Severe saturation baseline failures hit critical tech development corridors.";
            centers = [
                { name: "Omaha Hub (NE)", top: "120px", left: "320px" },
                { name: "Dallas Suburb Node (TX)", top: "430px", left: "220px" },
                { name: "Cheyenne Link (WY)", top: "130px", left: "40px" },
                { name: "Platte River Node (NE)", top: "150px", left: "230px" }
            ];
        }

        const aquifer = document.getElementById('simulated-aquifer');
        aquifer.style.width = width + "px";
        aquifer.style.height = height + "px";
        aquifer.style.backgroundColor = color;
        aquifer.style.opacity = opacity;
        document.getElementById('aquifer-status-label').innerHTML = labelText;
        document.getElementById('desc-display').innerText = descText;

        const container = document.getElementById('nodes-container');
        container.innerHTML = "";
        centers.forEach(c => {
            const node = document.createElement('div');
            node.className = 'dc-node';
            node.style.top = c.top;
            node.style.left = c.left;
            node.innerHTML = `<div class="node-label">${c.name}</div>`;
            container.appendChild(node);
        });

        ["1950", "1980", "2026", "2035", "2050"].forEach(lblYear => {
            document.getElementById(`lbl-${lblYear}`).className = (year == lblYear) ? 'active-label' : '';
        });
    }

    document.getElementById('timeline').addEventListener('input', (e) => {
        updateTimeline(parseInt(e.target.value));
    });

    updateTimeline(2026);
</script>

</body>
</html>
