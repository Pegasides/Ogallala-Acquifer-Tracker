<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogallala Aquifer Timeline Map</title>
    
    <style>
        body {
            margin: 0; padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111111; color: #ffffff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #3b82f6; margin: 0; font-size: 2rem; }
        p { color: #cccccc; min-height: 48px; line-height: 1.5; }
        #map { height: 500px; width: 100%; border-radius: 8px; background: #222; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #333;}
        .controls { margin-top: 25px; }
        
        /* Smooth slider aesthetics */
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .labels { display: flex; justify-content: space-between; margin-top: 10px; color: #888; }
        .active-label { color: #3b82f6; font-weight: bold; }
        
        #simulated-aquifer {
            width: 85%; height: 85%;
            background-color: #2b6cb0;
            border-radius: 12px;
            /* Ultra-smooth transition for year-by-year shifting */
            transition: width 0.1s linear, height 0.1s linear, background-color 0.1s linear, opacity 0.1s linear;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dc-node {
            width: 14px; height: 14px;
            background-color: #ef4444;
            border: 2px solid white;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px #ef4444;
            animation: pulse 1.8s infinite ease-in-out;
            transition: opacity 0.2s ease;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .node-label {
            position: absolute; top: -20px; background: rgba(0,0,0,0.8);
            padding: 2px 6px; border-radius: 4px; font-size: 11px; white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Year: <span id="year-display">2026</span></h2>
        <p id="desc-display">Present Day. Data centers overlap with heavily depleted water tables.</p>
    </header>

    <div id="map">
        <div id="simulated-aquifer">
            <span id="aquifer-status-label" style="font-weight: bold; font-size: 1.2rem; pointer-events: none; text-shadow: 1px 1px 4px rgba(0,0,0,0.6)">Ogallala Aquifer Grid</span>
            <div id="nodes-container"></div>
        </div>
    </div>

    <div class="controls">
        <!-- FIXED: Min and Max changed to represent every actual numerical year directly -->
        <input type="range" id="timeline" min="1950" max="2050" step="1" value="2026">
        <div class="labels">
            <span id="lbl-1950">1950</span>
            <span id="lbl-1980">1980</span>
            <span id="lbl-2026" class="active-label">2026</span>
            <span id="lbl-2035">2035 Proj</span>
            <span id="lbl-2050">2050 Proj</span>
        </div>
    </div>
</div>

<script>
    // Smooth Mathematical Engine maps a year directly to visual styles
    function updateTimeline(year) {
        document.getElementById('year-display').innerText = year;
        
        let size, opacity, color, labelText, descText;
        let centers = [];

        // 1. Math equations to calculate smooth changes between eras
        if (year <= 1980) {
            // Era 1: 1950 to 1980 (Agriculture Begins)
            let pct = (year - 1950) / (1980 - 1950);
            size = 85 - (pct * 15); // shrinks from 85% to 70%
            opacity = 0.95 - (pct * 0.20); // drops from 0.95 to 0.75
            color = "#2b6cb0"; // stays solid blue
            labelText = `Aquifer Volume: ${Math.round(95 - (pct * 20))}%`;
            descText = "Post-WWII agricultural expansion brings heavy groundwater pumping layouts to the Plains.";
        } 
        else if (year <= 2026) {
            // Era 2: 1980 to 2026 (Modern Depletion)
            let pct = (year - 1980) / (2026 - 1980);
            size = 70 - (pct * 15); // shrinks from 70% to 55%
            opacity = 0.75 - (pct * 0.25); // drops from 0.75 to 0.50
            color = "#3182bd"; 
            labelText = `Aquifer Volume: ${Math.round(75 - (pct * 20))}%`;
            descText = "Present Day overview. Industrial demand cycles create critical regional drawdown cones.";
            centers = [{ name: "Omaha Hub", top: "25%", left: "75%" }, { name: "Dallas Node", top: "75%", left: "65%" }];
        } 
        else if (year <= 2035) {
            // Era 3: 2026 to 2035 (Early Tech Acceleration)
            let pct = (year - 2026) / (2035 - 2026);
            size = 55 - (pct * 15); // shrinks from 55% to 40%
            opacity = 0.50 - (pct * 0.20); // drops from 0.50 to 0.30
            color = "#d97706"; // turns Warning Amber
            labelText = `Critical Depletion: ${Math.round(55 - (pct * 25))}%`;
            descText = "Projected climate shifts force artificial intelligence footprints to compete directly for deep-well security.";
            centers = [{ name: "Omaha Hub", top: "25%", left: "75%" }, { name: "Dallas Node", top: "75%", left: "65%" }, { name: "Cheyenne Expansion", top: "30%", left: "20%" }];
        } 
        else {
            // Era 4: 2035 to 2050 (The Threatened Grid)
            let pct = (year - 2035) / (2050 - 2035);
            size = 40 - (pct * 15); // shrinks from 40% to 25%
            opacity = 0.30 - (pct * 0.18); // drops from 0.30 to 0.12
            color = "#dc2626"; // turns Severe Danger Red
            labelText = `Grid Failure Threat: ${Math.round(30 - (pct * 18))}%`;
            descText = "Projected 2050 saturation threshold failure. Computational corridors intersect heavily with depleted water grids.";
            centers = [{ name: "Omaha Hub", top: "25%", left: "75%" }, { name: "Dallas Node", top: "75%", left: "65%" }, { name: "Cheyenne Expansion", top: "30%", left: "20%" }, { name: "Platte River Node", top: "45%", left: "50%" }];
        }

        // 2. Apply calculated values instantly to page elements
        const aquifer = document.getElementById('simulated-aquifer');
        aquifer.style.width = size + "%";
        aquifer.style.height = size + "%";
        aquifer.style.backgroundColor = color;
        aquifer.style.opacity = opacity;
        document.getElementById('aquifer-status-label').innerText = labelText;
        document.getElementById('desc-display').innerText = descText;

        // 3. Render markers cleanly
        const container = document.getElementById('nodes-container');
        container.innerHTML = "";
        centers.forEach(c => {
            const node = document.createElement('div');
            node.className = 'dc-node';
            node.style.top = c.top;
            node.style.left = c.left;
            node.innerHTML = `<div class="node-label">${c.name}</div>`;
            container.appendChild(node);
        });

        // 4. Update timeline typography highlight states
        ["1950", "1980", "2026", "2035", "2050"].forEach(lblYear => {
            document.getElementById(`lbl-${lblYear}`).className = (year == lblYear) ? 'active-label' : '';
        });
    }

    // Attach tracking listener to look at raw number changes
    document.getElementById('timeline').addEventListener('input', (e) => {
        updateTimeline(parseInt(e.target.value));
    });

    // Run baseline for 2026 setup
    updateTimeline(2026);
</script>

</body>
</html>
