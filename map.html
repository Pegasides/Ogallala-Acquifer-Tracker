<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogallala Aquifer Timeline Map</title>
    
    <style>
        body {
            margin: 0; padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111111; color: #ffffff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #3b82f6; margin: 0; font-size: 2rem; }
        p { color: #cccccc; min-height: 48px; line-height: 1.5; }
        
        #map { 
            height: 550px; width: 100%; 
            border-radius: 8px; background: #16161a; 
            position: relative; overflow: hidden; 
            border: 1px solid #333;
        }
        
        .map-grid {
            position: absolute; width: 500px; height: 500px;
            top: 25px; left: 50%; transform: translateX(-50%);
        }
        
        /* State boundaries sitting securely as an interface layer */
        .state {
            position: absolute; border: 1px dashed #555562;
            background-color: rgba(255,255,255,0.01);
            color: #71717a; font-size: 11px; font-weight: bold;
            padding: 4px; border-radius: 4px;
            display: flex; align-items: flex-start; justify-content: flex-start;
            z-index: 15; pointer-events: none; 
        }
        
        #SD { top: 0px; left: 140px; width: 200px; height: 80px; }
        #WY { top: 90px; left: 0px; width: 130px; height: 90px; }
        #NE { top: 90px; left: 140px; width: 220px; height: 90px; }
        #CO { top: 190px; left: 10px; width: 120px; height: 95px; }
        #KS { top: 195px; left: 140px; width: 220px; height: 90px; }
        #NM { top: 295px; left: 10px; width: 120px; height: 110px; }
        #OK { top: 295px; left: 140px; width: 220px; height: 45px; }
        #TX { top: 350px; left: 105px; width: 180px; height: 140px; }

        /* The background water pockets */
        .aquifer-zone {
            position: absolute; transition: all 0.1s linear;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; pointer-events: none;
            font-size: 9px; font-weight: bold; color: rgba(255,255,255,0.25);
            text-align: center;
        }
        #zone-north { top: 50px; left: 145px; width: 180px; height: 120px; border-radius: 40% 50% 40% 40%; }
        #zone-central { top: 175px; left: 125px; width: 160px; height: 110px; border-radius: 30% 40% 40% 30%; }
        #zone-south { top: 290px; left: 115px; width: 130px; height: 140px; border-radius: 40% 30% 30% 50%; }

        .controls { margin-top: 25px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .labels { display: flex; justify-content: space-between; margin-top: 10px; color: #888; }
        .active-label { color: #3b82f6; font-weight: bold; }
        
        /* AI Center Nodes remaining as primary indicators */
        .dc-node {
            width: 12px; height: 12px; background-color: #ef4444;
            border: 2px solid white; border-radius: 50%; position: absolute;
            z-index: 25; animation: pulse 1.8s infinite ease-in-out;
        }
        .node-label {
            position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); border: 1px solid #ef4444;
            padding: 1px 6px; border-radius: 4px; font-size: 10px; white-space: nowrap; color: #fff;
        }
        
        /* FIXED: Community Well Node styles */
        .well-node {
            width: 8px; height: 8px; border-radius: 50%; position: absolute;
            z-index: 20; transition: background-color 0.2s linear; border: 1px solid #111;
        }
        .well-label {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            color: #a1a1aa; font-size: 9px; font-weight: 500; pointer-events: none; white-space: nowrap;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Year: <span id="year-display">2026</span></h2>
        <p id="desc-display">Present Day. Data centers overlap with heavily depleted water tables.</p>
    </header>

    <div id="map">
        <div class="map-grid">
            
            <!-- Structural Basemap States -->
            <div class="state" id="SD">SOUTH DAKOTA</div>
            <div class="state" id="WY">WYOMING</div>
            <div class="state" id="NE">NEBRASKA</div>
            <div class="state" id="CO">COLORADO</div>
            <div class="state" id="KS">KANSAS</div>
            <div class="state" id="NM">NEW MEXICO</div>
            <div class="state" id="OK">OKLAHOMA</div>
            <div class="state" id="TX">TEXAS</div>

            <!-- Regional Basins -->
            <div class="aquifer-zone" id="zone-north">North</div>
            <div class="aquifer-zone" id="zone-central">Central</div>
            <div class="aquifer-zone" id="zone-south">South</div>
            
            <!-- FIXED: Combined layer container for local community wells and data centers -->
            <div id="infrastructure-container"></div>
            
        </div>
    </div>

    <div class="controls">
        <input type="range" id="timeline" min="1950" max="2050" step="1" value="2026">
        <div class="labels">
            <span id="lbl-1950">1950</span>
            <span id="lbl-1980">1980</span>
            <span id="lbl-2026" class="active-label">2026</span>
            <span id="lbl-2035">2035 Proj</span>
            <span id="lbl-2050">2050 Proj</span>
        </div>
    </div>
</div>

<script>
    // FIXED: Dictionary mapping specific critical local aquifer communities to their geographic coordinates
    const localCommunities = [
        { name: "Alliance (NE)", top: "110px", left: "160px", basin: "north" },

        { name: "Guymon (OK)", top: "310px", left: "150px", basin: "south" },
        { name: "Plainview (TX)", top: "380px", left: "140px", basin: "south" },
        { name: "Lubbock (TX)", top: "410px", left: "150px", basin: "south" }
    ];

    function updateTimeline(year) {
        document.getElementById('year-display').innerText = year;
        
        let north = {}, central = {}, south = {};
        let descText = "";
        let dataCenters = [];

        // Track safety status colors for localized community networks
        let northStatusColor = "#22c55e"; // green
        let centralStatusColor = "#22c55e"; 
        let southStatusColor = "#22c55e";

        if (year <= 1980) {
            let pct = (year - 1950) / (1980 - 1950);
            descText = "Post-WWII agriculture triggers early deep-well turbine layouts. Local municipal networks remain structurally secure.";

            south   = { w: 130, h: 140, o: 0.85, c: "#3b82f6" };
            
            // 1950-1980: Southern sector feels early agricultural drawdowns, turning local wells yellow
            if (year > 1965) southStatusColor = "#f59e0b"; // yellow
        } 
        else if (year <= 2026) {
            let pct = (year - 1980) / (2026 - 1980);

                { name: "Dallas Suburb Node (TX)", top: "430px", left: "220px" }
            ];

            north   = { w: 180 - pct*10, h: 120 - pct*5,  o: 0.75, c: "#3b82f6" };
            central = { w: 140 - pct*20, h: 100 - pct*15, o: 0.60, c: "#f59e0b" };
            south   = { w: 110 - pct*30, h: 115 - pct*35, o: 0.65, c: "#ea580c" };

            northStatusColor = "#22c55e";   // Green (Stable)
            centralStatusColor = "#f59e0b"; // Yellow (Active Restrictions)
            southStatusColor = "#ef4444";   // Red (Severe Local Drawdown Emergency)
        } 
        else if (year <= 2035) {
            let pct = (year - 2026) / (2035 - 2026);
            descText = "Projected 2035. Machine learning infrastructure clusters multiply. Central Kansas well clusters slip from warning yellow to severe red.";
            dataCenters = [
                { name: "Omaha Hub (NE)", top: "120px", left: "320px" },
                { name: "Dallas Suburb Node (TX)", top: "430px", left: "220px" },
                { name: "Cheyenne Link (WY)", top: "130px", left: "40px" }
            ];

            north   = { w: 170 - pct*15, h: 115 - pct*10, o: 0.65, c: "#f59e0b" };
            central = { w: 120 - pct*25, h: 85 - pct*20,  o: 0.45, c: "#ef4444" };
            south   = { w: 80 - pct*20,  h: 80 - pct*25,  o: 0.40, c: "#991b1b" };

            northStatusColor = "#f59e0b";   // Yellow
            centralStatusColor = "#ef4444"; // Red
            southStatusColor = "#ef4444";   // Red
        } 
        else {
            let pct = (year - 2035) / (2050 - 2035);
            descText = "Projected 2050. Only Northern sectors sustain viable yields. Central and Southern community well fields face complete structural depletion.";
            dataCenters = [
                { name: "Omaha Hub (NE)", top: "120px", left: "320px" },
